<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>สภาพอากาศเรียลไทม์</title>
<meta name="theme-color" content="#0ea5e9">
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;font-family:'Kanit',sans-serif}
  body{margin:0;background:linear-gradient(135deg,#0ea5e9,#6366f1);color:#fff;min-height:100vh}
 .container{max-width:900px;margin:0 auto;padding:16px}
  header{display:flex;gap:8px;align-items:center;margin-bottom:16px}
  input{flex:1;padding:12px;border-radius:12px;border:none;font-size:16px}
  button{padding:12px 16px;border:none;border-radius:12px;background:#fff;color:#0ea5e9;font-weight:600;cursor:pointer}
  #installBtn{display:none;background:#22c55e;color:#fff}
 .card{background:rgba(255,255,255,.15);backdrop-filter:blur(12px);border-radius:20px;padding:20px;margin-bottom:16px}
 .current{display:flex;justify-content:space-between;align-items:center}
 .temp{font-size:64px;font-weight:700}
 .hourly{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px}
 .hour{min-width:80px;text-align:center;background:rgba(255,255,255,.1);padding:8px;border-radius:12px}
 .daily{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}
 .day{background:rgba(255,255,255,.1);padding:12px;border-radius:12px;text-align:center}
</style>
</head>
<body>
<div class="container">
  <header>
    <input id="search" placeholder="ค้นหาเมือง เช่น กรุงเทพ, Bangkok">
    <button onclick="getWeather()">ค้นหา</button>
    <button id="installBtn">ติดตั้งแอป</button>
  </header>

  <div id="app" class="card">กำลังหาตำแหน่งของคุณ...</div>
</div>

<script>
// 1. PWA: Service Worker
if('serviceWorker' in navigator){
  navigator.serviceWorker.register(URL.createObjectURL(new Blob([`
    self.addEventListener('fetch', e => {})
  `],{type:'text/javascript'})))
}

// 2. PWA: Install Button
let deferredPrompt;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('installBtn').style.display = 'block';
});
document.getElementById('installBtn').onclick = async () => {
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  document.getElementById('installBtn').style.display = 'none';
}

// 3. ขอสิทธิ์แจ้งเตือน
if('Notification' in window && Notification.permission === 'default'){
  Notification.requestPermission();
}

async function getWeather(lat, lon){
  if(!lat){
    if(navigator.geolocation){
      navigator.geolocation.getCurrentPosition(pos => getWeather(pos.coords.latitude, pos.coords.longitude));
      return;
    }
  }
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,precipitation,uv_index&hourly=temperature_2m,weather_code,precipitation_probability&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset&timezone=auto`;
  const res = await fetch(url);
  const data = await res.json();
  render(data);
  checkRainAlert(data.hourly);
}

function render(d){
  const c = d.current;
  const html = `
    <div class="current">
      <div>
        <div class="temp">${Math.round(c.temperature_2m)}°</div>
        <div>รู้สึกเหมือน ${Math.round(c.apparent_temperature)}°</div>
      </div>
      <div>💧${c.relative_humidity_2m}% | 🌬️${c.wind_speed_10m} km/h | UV ${c.uv_index}</div>
    </div>
    <h3>24 ชั่วโมงข้างหน้า</h3>
    <div class="hourly">${d.hourly.time.slice(0,24).map((t,i)=>`
      <div class="hour">
        <div>${new Date(t).getHours()}น</div>
        <div>${Math.round(d.hourly.temperature_2m[i])}°</div>
        <div>${d.hourly.precipitation_probability[i]}%</div>
      </div>
    `).join('')}</div>
    <h3>7 วัน</h3>
    <div class="daily">${d.daily.time.map((t,i)=>`
      <div class="day">
        <div>${new Date(t).toLocaleDateString('th-TH',{weekday:'short'})}</div>
        <div>${Math.round(d.daily.temperature_2m_max[i])}° / ${Math.round(d.daily.temperature_2m_min[i])}°</div>
      </div>
    `).join('')}</div>
  `;
  document.getElementById('app').innerHTML = html;
}

function checkRainAlert(hourly){
  const next2h = hourly.precipitation_probability.slice(0,2);
  if(next2h.some(p => p > 70) && Notification.permission === 'granted'){
    new Notification('สภาพอากาศ', {
      body: 'ฝนจะตกในอีกไม่กี่ชั่วโมง เตรียมร่มด้วยนะ ☔',
      icon: 'https://cdn-icons-png.flaticon.com/512/414/414927.png'
    });
  }
}

// ค้นหาเมือง
async function searchCity(q){
  const res = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${q}`);
  const data = await res.json();
  if(data.results) getWeather(data.results[0].latitude, data.results[0].longitude);
}
document.getElementById('search').onkeydown = e => { if(e.key==='Enter') searchCity(e.target.value) }

// ตรวจทุก 30 นาที
setInterval(()=>{ if(window.lastLat) getWeather(window.lastLat, window.lastLon) }, 30*60*1000);
</script>
</body>
</html>
